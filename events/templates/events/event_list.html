<h1>Events</h1>
<table border="1" cellpadding="6">
    <tr><th>Title</th><th>Type</th><th>Venue</th><th>Price</th></tr>
    {% for e in events %}
    <tr>
        <td>{{ e.title }}</td>
        <td>{{ e.get_kind_display }}</td>
        <td>{{ e.venue }}</td>
        <td>{{ e.price }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="4">No events available.</td></tr>
    {% endfor %}
</table>
<p><a href="{% url 'dashboard' %}">Back to dashboard</a></p>
