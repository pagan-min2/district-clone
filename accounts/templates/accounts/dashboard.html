<h1>Welcome, {{ user.username }}!</h1>
<p>Balance: {{ user.profile.balance }}</p>
<p>
    <a href="{% url 'event_list' %}">Browse events</a> |
    <a href="{% url 'my_tickets' %}">My tickets</a> |
    <a href="{% url 'add_money' %}">Add money</a> |

    <button type="submit">Log out</button>
</form>
