<h2>Transaction history</h2>
<p>Current balance: {{ user.profile.balance }}</p>
<table border="1" cellpadding="6">
    <tr><th>When</th><th>Type</th><th>Amount</th><th>Description</th></tr>
    {% for t in history %}
    <tr>
        <td>{{ t.created_at }}</td>
        <td>{{ t.kind }}</td>
        <td>{{ t.amount }}</td>
        <td>{{ t.description }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="4">No transactions yet.</td></tr>
    {% endfor %}
</table>
<a href="{% url 'add_money' %}">Add money</a> | <a href="{% url 'dashboard' %}">Dashboard</a>
